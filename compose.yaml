services:
  api:
    build:
      context: .
      target: api
    volumes:
      - runs:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${AEROTEST_WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 12
volumes:
  runs:
