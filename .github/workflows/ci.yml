name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25.0.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies and build tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install cmake==4.4.3 ninja==1.13.2
          python -m pip check
      - name: Build and test C++
        run: |
          mkdir -p artifacts
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --output-junit "$PWD/artifacts/cpp-tests.xml"
      - name: Python and cross-language checks
        run: |
          python -m pytest -q --junitxml=artifacts/python-tests.xml
          ruff check backend scripts
          python scripts/export_contracts.py --check
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Save actual test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-test-reports
          path: artifacts/*.xml
          if-no-files-found: ignore
