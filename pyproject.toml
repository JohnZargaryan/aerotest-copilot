[project]
name = "aerotest-copilot"
version = "0.1.0"
description = "Educational simulation and evidence-based test investigation"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.53.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["aerotest"]
